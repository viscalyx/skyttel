name: Application checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/install-repository-npm.mjs
      # Cache initialization invokes npm, so install the required version first.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Workflow gate tests
        run: |
          mkdir -p logs/tests
          npm run test:gates 2>&1 | tee logs/tests/gates.log
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:docs
      - run: npm run build
      - name: Unit coverage with CI fonts
        run: |
          mkdir -p logs/tests
          npm run test:unit:ci -- --coverage 2>&1 | tee logs/tests/unit.log
      - name: Integration tests with CI fonts
        run: |
          npm run test:integration:ci -- --reporter=line,./tests/support/diagnostics-reporter.ts 2>&1 | tee logs/tests/integration.log
      - name: Container checks
        run: |
          npm run test:container 2>&1 | tee logs/tests/container.log
      - name: Retain failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-test-diagnostics-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report*/
            tests/browser/__screenshots__/
            .vitest/attachments/
            logs/tests/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/install-repository-npm.mjs
      - run: npm ci
      - run: npm run test:devcontainer

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  security-gate:
    if: always()
    needs: [application, devcontainer, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/security/check-results.mjs jobs application devcontainer security
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
