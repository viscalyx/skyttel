name: CI feedback measurement

on:
  pull_request:
    paths:
      - .github/workflows/ci-feedback-measurement.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  groups:
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/install-repository-npm.mjs
      - run: npm ci
      - name: Prepare isolated measurement fixtures
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          const root = 'tmp/ci-feedback';
          mkdirSync(root, { recursive: true });
          const playwright = JSON.stringify(resolve('node_modules/@playwright/test/index.mjs'));
          writeFileSync(`${root}/playwright.config.mjs`, `export default { testDir: '.', outputDir: '../../test-results', workers: 1, retries: 0, timeout: 210000 };`);
          writeFileSync(`${root}/failure.spec.mjs`, `import { test, expect } from ${playwright};
            test('controlled first-attempt failure', () => { console.error('MEASUREMENT_FAILURE_AT', new Date().toISOString()); expect(process.env.GITHUB_RUN_ATTEMPT).not.toBe('1'); });
            test('remaining case executes on complete retry', () => { console.log('MEASUREMENT_REMAINDER_EXECUTED'); });`);
          writeFileSync(`${root}/slow.spec.mjs`, `import { test } from ${playwright};
            test('independent bounded workload', async () => { await new Promise(resolve => setTimeout(resolve, 180000)); });`);
          writeFileSync(`${root}/timings.json`, JSON.stringify({ version: 1, groups: 2, files: {
            [`${root}/slow.spec.mjs`]: { seconds: 180, tests: 1 },
            [`${root}/failure.spec.mjs`]: { seconds: 1, tests: 2 }
          } }));
          NODE
      - name: Run measurement group
        env:
          MEASUREMENT_GROUP: ${{ matrix.group }}
        run: |
          mkdir -p logs/tests
          npm run test:env -- node scripts/testing/integration-groups.mjs --group "$MEASUREMENT_GROUP" --config tmp/ci-feedback/playwright.config.mjs --timings tmp/ci-feedback/timings.json 2>&1 | tee logs/tests/measurement.log
      - name: Retain measurement evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-feedback-measurement-${{ matrix.group }}-${{ github.run_attempt }}
          path: |
            test-results/
            logs/tests/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  aggregate:
    if: always()
    needs: [groups]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/security/check-results.mjs jobs groups
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
