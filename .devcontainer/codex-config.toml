# User-level Codex settings required by the Skyttel devcontainer.
# The devcontainer postCreateCommand merges this into ~/.codex/config.toml.
# Then Codex automatically layers the project’s .codex/config.toml on top of it.

approval_policy = "never"
default_permissions = "skyttel-development"
# Default to credentials in the persistent container-owned home, not an OS keyring.
cli_auth_credentials_store = "file"

[projects."/workspace"]
trust_level = "trusted"

[permissions.skyttel-development]
description = "Workspace access with Skyttel local development network."
extends = ":workspace"

[permissions.skyttel-development.filesystem]
"~/.codex/skills" = "write"

[permissions.skyttel-development.filesystem.":workspace_roots"]
".codex" = "write"
".git" = "write"

[permissions.skyttel-development.network]
enabled = true
allow_local_binding = true

[permissions.skyttel-development.network.domains]
"localhost" = "allow"
"127.0.0.1" = "allow"
"::1" = "allow"

[plugins.openai-templates]
enabled = false

[plugins.plugin-management]
enabled = false

[[skills.config]]
path = "/home/vscode/.codex/skills/.system/plugin-creator/SKILL.md"
enabled = false

[[skills.config]]
path = "/home/vscode/.codex/skills/.system/review-agent/SKILL.md"
enabled = false

[[skills.config]]
path = "/home/vscode/.codex/skills/.system/skill-creator/SKILL.md"
enabled = false

[[skills.config]]
path = "/home/vscode/.codex/skills/.system/skill-installer/SKILL.md"
enabled = false
